# Zynx Linux: LightDM autologin on the live medium.
#
# /etc/pam.d/lightdm-autologin (shipped by lightdm) contains
#   auth [success=1 default=ignore] pam_succeed_if.so user ingroup autologin
# but the lightdm package never creates the "autologin" group, so autologin
# silently falls back to the greeter.  Defining the group here makes it
# deterministic: systemd-sysusers creates it during the image build and again
# at every boot that finds it missing.
g autologin - -
