# Zynx live initramfs configuration (drop-in).
#
# mkinitcpio owns /etc/mkinitcpio.conf and installs its default file when the
# package is installed into the airootfs.  A drop-in survives that install and
# is sourced after the main configuration, so these values win.
#
# The archiso hooks mount the squashfs from the boot medium.  PXE hooks are
# intentionally omitted because this image boots from local media only.
MODULES=(amdgpu)

HOOKS=(base udev microcode modconf archiso archiso_loop_mnt block filesystems keyboard)

# zstd decompresses much faster than xz and still gives a good size.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
